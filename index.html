<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailing Job Timeline Calculator & Postage Estimater</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="image-container">
        <img src="image.png" alt="Mailing Calculator Logo">
    </div>
    <div class="container">
        <div class="form-column">
            <h1>Mailing Job Timeline Calculator & Postage Estimater</h1>
            <p>Enter details to estimate total time based on per 1,000 pieces rates from the document.</p>
            
            <label for="pieces">Number of Mail Pieces:</label>
            <input type="text" id="pieces" value="1,000">
            
            <div class="checkbox-container">
                <input type="checkbox" id="processingList">
                <label for="processingList">Processing List (20 min)</label>
            </div>
            
            <label for="envelopeType">Opening Envelopes (Env Type):</label>
            <select id="envelopeType">
                <option value="none">No Opening</option>
                <option value="10">10 (30 min/1000 to open)</option>
                <option value="A7">A7 (45 min/1000 to open)</option>
            </select>
            
            <label for="inserts">Number of Inserts:</label>
            <select id="inserts">
                <option value="0">No Inserts</option>
                <option value="1">1 Insert</option>
                <option value="2">2 Inserts</option>
                <option value="3">3 Inserts</option>
            </select>
            
            <label for="insertMethod">Inserting Method:</label>
            <select id="insertMethod">
                <option value="none">No Inserting</option>
                <option value="manual">Manual</option>
                <option value="automated">Automated</option>
            </select>
            
            <label for="addressing">Addressing Mail:</label>
            <select id="addressing">
                <option value="no">No</option>
                <option value="yes">Yes (20 min/1000)</option>
            </select>
            
            <label for="sealingMethod">Sealing Method:</label>
            <select id="sealingMethod">
                <option value="none">No Sealing</option>
                <option value="manual">Manual (60 min/1000)</option>
                <option value="automated">Automated (20 min/1000)</option>
            </select>
            
            <label for="stamps">Applying Stamps:</label>
            <select id="stamps">
                <option value="no">No</option>
                <option value="yes">Yes (20 min/1000)</option>
            </select>
            
            <label for="tabbing">Tabbing:</label>
            <select id="tabbing">
                <option value="no">No</option>
                <option value="yes">Yes (20 min/1000)</option>
            </select>
            
            <label for="mailType">Mail Type:</label>
            <select id="mailType">
                <option value="standard">Standard (No EDDM Prep)</option>
                <option value="eddm">EDDM (Includes 15 min/1000 Prep)</option>
                <option value="eddm_strap">EDDM (Includes 10 min/1000 Prep) [1 Strap Already Done]</option>
            </select>
            
            <div class="checkbox-container">
                <input type="checkbox" id="centerSheet">
                <label for="centerSheet">Insert Center/Facing Sheet (EDDM) [5 min/1000]</label>
            </div>
            
            <div class="checkbox-container">
                <input type="checkbox" id="loadingTransport">
                <label for="loadingTransport">Loading/Transport (30 min)</label>
            </div>
            
            <button id="calculate">Calculate Total Time</button>
        </div>
        <div class="results-column">
            <div id="results"></div>
            <div id="postage-costs"></div>
            <button id="reset">Reset Form</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
